# fly.toml — Bank Statement Parser (Flask/Python on Fly.io)
# See https://fly.io/docs/reference/configuration/

app = 'tohundguide-bankparser'
primary_region = 'bom'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  PYTHONUNBUFFERED = '1'
  SCRIPT_NAME = '/tools/bankstatementparser'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/tools/bankstatementparser/status'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
  processes = ['app']

